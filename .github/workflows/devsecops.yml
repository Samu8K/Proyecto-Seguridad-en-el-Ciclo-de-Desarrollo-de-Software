name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        node-version: ['20']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install semgrep pip-audit

      - name: Run Semgrep security scan
        run: |
          semgrep scan --config auto --json --output backend/semgrep-results.json

      - name: Run pip-audit
        run: |
          pip-audit --json --output backend/pip-audit.json --fail-on=high || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build backend Docker image
        run: |
          docker build -f backend/Dockerfile -t devsecops-backend:ci backend

      - name: Build frontend Docker image
        run: |
          docker build -f frontend/Dockerfile -t devsecops-frontend:ci frontend

      - name: Upload security and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-reports
          path: |
            backend/semgrep-results.json
            backend/pip-audit.json

      - name: Send results to ASPM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_URL: ${{ secrets.ASPM_API_URL }}
          API_KEY: ${{ secrets.ASPM_API_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "⚠️  Secrets ASPM_API_URL or ASPM_API_KEY not configured. Skipping..."
            exit 0
          fi
          
          if [ ! -f "backend/semgrep-results.json" ]; then
            echo "⚠️  No Semgrep results found. Skipping ASPM ingestion..."
            exit 0
          fi
          
          for i in 1 2 3; do
            echo "Attempt $i: Sending security scan results to ASPM..."
            status=$(curl -X POST "$API_URL/api/ingest/" \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              -d @backend/semgrep-results.json \
              -w '%{http_code}' -s -o /tmp/response.json)
            
            if [ "$status" -eq 202 ] || [ "$status" -eq 200 ]; then
              echo "✅ Successfully ingested security scan results"
              cat /tmp/response.json
              exit 0
            else
              echo "❌ Failed with status $status"
              cat /tmp/response.json
              [ $i -lt 3 ] && sleep 5
            fi
          done
          echo "❌ Failed to ingest results after 3 attempts"
          exit 1
