name: SSDLC Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sunday at 2 AM UTC

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    name: Semgrep Code Analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --json --output results.json || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: results.json

      - name: Check Semgrep findings
        run: |
          if [ -f results.json ]; then
            python3 << 'EOF'
          import json
          with open('results.json', 'r') as f:
            data = json.load(f)
            errors = len(data.get('results', []))
            if errors > 0:
              print(f"⚠️  Found {errors} potential security issues")
            else:
              print("✅ No critical issues found")
          EOF
          else
            echo "No Semgrep results found"
          fi

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pip-audit on backend
        run: |
          pip install pip-audit
          pip-audit --json --output pip-audit-results.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit on frontend
        run: |
          cd frontend
          npm audit --json > npm-audit-results.json || true

      - name: Upload dependency results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-results
          path: |
            pip-audit-results.json
            frontend/npm-audit-results.json

  ingest-to-aspm:
    needs: [semgrep-scan, dependency-check]
    runs-on: ubuntu-latest
    name: Ingest Results to ASPM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./scan-results

      - name: Check ASPM Configuration
        run: |
          if [ -z "${{ secrets.ASPM_API_URL }}" ] || [ -z "${{ secrets.ASPM_API_KEY }}" ]; then
            echo "⚠️  ASPM_API_URL or ASPM_API_KEY not configured"
            echo "Configure these secrets in Settings > Secrets and variables > Actions"
            exit 0
          fi
          echo "✅ ASPM credentials found"

      - name: Send Semgrep results to ASPM
        if: ${{ secrets.ASPM_API_URL != '' }}
        env:
          API_URL: ${{ secrets.ASPM_API_URL }}
          API_KEY: ${{ secrets.ASPM_API_KEY }}
        run: |
          RESULT_FILE="scan-results/semgrep-results/results.json"
          if [ ! -f "$RESULT_FILE" ]; then
            echo "No Semgrep results file found, skipping ingestion"
            exit 0
          fi
          
          for i in 1 2 3; do
            echo "Attempt $i/3: Sending results to ASPM..."
            HTTP_STATUS=$(curl -s -X POST "$API_URL/api/ingest/" \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              -d @"$RESULT_FILE" \
              -w '%{http_code}' -o response.json)
            
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 202 ]; then
              echo "✅ Successfully ingested (HTTP $HTTP_STATUS)"
              cat response.json
              exit 0
            else
              echo "❌ Failed with HTTP $HTTP_STATUS"
              cat response.json || true
              [ $i -lt 3 ] && sleep 10
            fi
          done
          
          echo "⚠️  Could not ingest after 3 attempts, but workflow continues"
          exit 0

  summary:
    needs: [semgrep-scan, dependency-check]
    runs-on: ubuntu-latest
    name: Security Summary
    if: always()
    steps:
      - name: Print Security Summary
        run: |
          echo "=== Security Scan Summary ==="
          echo "✓ Semgrep analysis completed"
          echo "✓ Dependency vulnerability check completed"
          echo ""
          echo "Artifacts available in Actions tab for review"
